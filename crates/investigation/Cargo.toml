[package]
name = "apex-investigation"
version = "0.1.0"
edition = "2021"
authors = ["ApexIntel Team"]
description = "Deep investigation framework for OSINT intelligence analysis"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sabelakhoua/ApexIntel"
homepage = "https://github.com/sabelakhoua/ApexIntel"
keywords = ["osint", "intelligence", "investigation", "threat-analysis"]
categories = ["business", "security"]

[dependencies]
# Core utilities
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }

# Threat intelligence integration
apex-threat-intel = { workspace = true }

# POI profiling - real data extraction
apex-poi = { path = "../poi" }

# Async runtime
tokio = { version = "1.0", features = ["rt", "macros"] }

# Optional: tracing for debugging
tracing = { version = "0.1", optional = true }

# Optional: machine learning utilities
ndarray = { version = "0.15", optional = true }

[dev-dependencies]
# Testing utilities
tokio = { version = "1.0", features = ["rt", "macros", "test-util"] }

[features]
default = []
full = ["tracing", "ndarray"]
[lints]
workspace = true
