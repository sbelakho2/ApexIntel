[package]
name = "apex-llm"
version = "0.2.0"
edition = "2021"
authors = ["ApexIntel Team"]
description = "LLM integration for ApexIntel OSINT platform"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sabelakhoua/ApexIntel"

[dependencies]
# Core
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
secrecy = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = { workspace = true }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"
sha2 = "0.10"

# Workspace internal crates
apex-core = { path = "../core" }

[dev-dependencies]
tokio-test = "0.4"

[features]
experimental = []
