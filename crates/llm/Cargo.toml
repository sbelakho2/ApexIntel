[package]
name = "apex-llm"
version = "0.1.0"
edition = "2021"

# ─────────────────────────────────────────────────────────────────────────────
# Feature flags (B290)
#
# `experimental` — enables the `function_calling` module which exposes the
#   OpenAI tool-calling schema (FunctionSpec / FunctionCall).  The feature is
#   opt-in because:
#   (a) llama.cpp function-calling support is limited and provider-dependent,
#   (b) the API is expected to evolve as the standard matures.
#
# Usage:
#   cargo build -p apex-llm --features experimental
#   cargo test  -p apex-llm --features experimental
# ─────────────────────────────────────────────────────────────────────────────
[features]
default = []
experimental = []

[dependencies]
apex-core = { path = "../core" }
serde = { workspace = true, features = ["derive"] }
serde_json = "1"
chrono = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
tokio = { workspace = true, features = ["full"] }
sha2 = { workspace = true }
