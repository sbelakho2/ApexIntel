[package]
name = "apex-shared"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }

# The NATS helpers need tokio/mio, which do not build for wasm32. apex-shared
# must stay wasm-compatible (CI `wasm-shared` step), so they are native-only.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
async-nats = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }

[lints]
workspace = true
