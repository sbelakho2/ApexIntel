[package]
name = "apex-threat-intel"
version = "0.1.0"
edition = "2021"
authors = ["ApexIntel Team"]
description = "Threat Intelligence Module for ApexIntel OSINT platform"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sabelakhoua/ApexIntel"

[dependencies]
# Core
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }

# URL handling
url = "2"

[dev-dependencies]
tokio-test = "0.4"
proptest = "1"

[[test]]
name = "threat_intel_tests"
path = "tests/lib.rs"
