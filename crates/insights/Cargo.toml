[package]
name = "apex-insights"
version = "0.2.0"
edition = "2021"
authors = ["ApexIntel Team"]
description = "Intelligence insights generation for ApexIntel OSINT platform"
repository = "https://github.com/sabelakhoua/ApexIntel"

[dependencies]
# Core
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { workspace = true }
thiserror = { workspace = true }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }

# Cross-crate dependencies (using workspace versions)
apex-core = { path = "../core" }
apex-llm = { path = "../llm" }
apex-poi = { path = "../poi" }
apex-stats = { path = "../stats" }

# Additional dependencies
regex = "1"
sha2 = "0.10"
hex = "0.4"
lru = "0.12"
rand = "0.8"
serde_yaml = "0.9"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tokio-test = "0.4"

[features]
default = []
llm = []

[lints]
workspace = true
