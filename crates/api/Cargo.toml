[package]
name = "apex-api"
version = "0.1.0"
edition = "2021"

# ─────────────────────────────────────────────────────────────────────────────
# Feature flags
#
# `llm` — enables LLM-powered API routes (entity extraction, memo generation,
#   recipe hypothesis, POI synthesis).  When disabled, these endpoints return
#   501 Not Implemented.
# ─────────────────────────────────────────────────────────────────────────────
[features]
default = []
llm = ["apex-llm"]

[dependencies]
apex-core = { path = "../core" }
apex-store = { path = "../store" }
apex-shared = { path = "../shared" }
apex-llm = { path = "../llm", optional = true }
sqlx = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = "1"
chrono = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["full"] }
axum = { workspace = true }
axum-extra = { version = "0.9", features = ["form"] }
tower-http = { workspace = true, features = ["cors", "trace", "compression-gzip", "fs"] }
tracing-subscriber = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
regex = { workspace = true }
subtle = "2"
dotenvy = { workspace = true }
url = { workspace = true }
prometheus = "0.14"
lazy_static = "1.4"
redis = { workspace = true }
reqwest = { workspace = true }
async-nats = { workspace = true }
async-trait = { workspace = true }
askama = { version = "0.12", features = ["with-axum"] }
askama_axum = "0.4"
hmac = "0.12"
parking_lot = "0.12"
base64 = "0.22"
secrecy = "0.10"
async-stream = "0.3"
futures-core = "0.3"

[dev-dependencies]
tower = { workspace = true }
http-body-util = "0.1"