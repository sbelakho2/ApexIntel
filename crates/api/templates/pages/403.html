{% extends "base.html" %}
{% import "macros.html" as m %}

{% block title %}403 — ApexIntel{% endblock %}

{% block content %}
<div class="flex min-h-[70vh] items-center justify-center py-12">
  <section class="apex-state-panel text-center">
    <p class="text-[10px] font-black uppercase tracking-[0.16em] text-rams-muted">Permission Error</p>
    <div class="mx-auto mt-5 flex h-16 w-16 items-center justify-center rounded-sm border border-rams-line bg-rams-panel text-rams-muted">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
    </div>
    <h1 class="mt-5 text-4xl font-black">403</h1>
    <p class="mx-auto mt-3 text-sm text-rams-muted">Your account does not have permission to perform this action.</p>
    <div class="mt-6 flex items-center justify-center">
      <a href="/" class="apex-btn apex-btn-secondary">Return to Dashboard</a>
    </div>
  </section>
</div>
{% endblock %}
