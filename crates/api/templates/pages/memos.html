{% extends "base.html" %}
{% import "macros.html" as m %}

{% block title %}Memos — ApexIntel{% endblock %}

{% block breadcrumbs %}
<nav class="apex-card px-4 py-2.5 mb-6" aria-label="Breadcrumb">
  <ol class="flex items-center gap-1 text-[10px] font-black uppercase tracking-[0.12em] text-rams-muted">
    <li><a href="/" class="hover:text-rams-foreground">Home</a></li>
    <li class="select-none">/</li>
    <li class="text-rams-foreground" aria-current="page">Memos</li>
  </ol>
</nav>
{% endblock %}

{% block content %}
<div id="memos-list-zone"
     hx-get="/memos/_list"
     hx-trigger="load once, refreshMemos from:body"
     hx-indicator="#memos-loading">
  <div id="memos-loading" class="htmx-indicator flex justify-center py-12">
    <span class="apex-spinner apex-spinner-md" aria-label="Loading memos…" role="status"></span>
  </div>
</div>
{% endblock %}
