{% extends "base.html" %}
{% import "macros.html" as m %}

{% block title %}Competitors — ApexIntel{% endblock %}

{% block breadcrumbs %}
<nav class="apex-card px-4 py-2.5 mb-6" aria-label="Breadcrumb">
  <ol class="flex items-center gap-1 text-[10px] font-black uppercase tracking-[0.12em] text-rams-muted">
    <li><a href="/" class="hover:text-rams-foreground">Home</a></li>
    <li class="select-none">/</li>
    <li class="text-rams-foreground" aria-current="page">Competitors</li>
  </ol>
</nav>
{% endblock %}

{% block content %}
<div id="main-results"
     hx-get="/competitors/_list?page=1{% if !active_status.is_empty() %}&status={{ active_status }}{% endif %}"
     hx-trigger="load once, refreshCompetitors from:body">
</div>
{% endblock %}
