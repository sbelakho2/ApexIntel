<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ApexIntel{% endblock %}</title>
  <link rel="preload" href="/static/fonts/InterVariable.woff2?v=20260311-ui-fix-1" as="font" type="font/woff2" crossorigin>
  <script>
    (() => {
      const storageKey = 'apex-theme';
      const validThemes = new Set(['light', 'dark', 'system']);
      const root = document.documentElement;
      const media = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
      const normalizeTheme = (value) => validThemes.has(value) ? value : 'system';
      const resolveTheme = (theme) => theme === 'system'
        ? (media?.matches ? 'dark' : 'light')
        : theme;
      const applyTheme = (theme) => {
        const normalized = normalizeTheme(theme);
        const resolved = resolveTheme(normalized);
        root.dataset.theme = normalized;
        root.classList.toggle('dark', resolved === 'dark');
        root.style.colorScheme = resolved;
        window.__apexThemeState = { theme: normalized, resolved };
        document.dispatchEvent(new CustomEvent('apex:themechange', { detail: { theme: normalized, resolved } }));
      };
      const readCookie = (name) => {
        if (!document.cookie) return null;
        const prefix = name + '=';
        const match = document.cookie.split(';').map((part) => part.trim()).find((part) => part.startsWith(prefix));
        return match ? decodeURIComponent(match.slice(prefix.length)) : null;
      };
      // The server-written cookie mirrors the account preference; prefer it so
      // the login page matches the theme the operator sees after sign-in.
      const getTheme = () => normalizeTheme(readCookie('apex_theme') || window.localStorage?.getItem(storageKey) || root.dataset.theme || 'system');
      const setTheme = (theme) => {
        const normalized = normalizeTheme(theme);
        window.localStorage?.setItem(storageKey, normalized);
        applyTheme(normalized);
      };
      const cycleTheme = () => {
        const current = getTheme();
        let next = 'dark';
        if (current === 'dark') {
          next = 'light';
        } else if (current === 'light') {
          next = 'dark';
        } else if (resolveTheme(current) === 'dark') {
          next = 'light';
        }
        setTheme(next);
      };
      window.ApexTheme = { getTheme, setTheme, cycleTheme };
      applyTheme(getTheme());
    })();
  </script>
  <link rel="stylesheet" href="/static/css/tailwind.css?v=20261005-sensei-1">
  <link rel="stylesheet" href="/static/css/sensei-rams.css?v=3.7.0">
  <link rel="stylesheet" href="/static/css/apex-rams.css?v=20261005-sensei-1">
</head>
<body class="font-sans antialiased apex-standalone-shell">
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <button type="button" class="standalone-theme-toggle" data-theme-toggle aria-label="Toggle theme">
    <span data-theme-toggle-text>System</span>
    <span class="text-[9px] text-rams-muted" data-theme-toggle-state>Day</span>
  </button>
  <div class="relative min-h-screen">
    {% block content %}{% endblock %}
  </div>
  <script>
    (() => {
      const buttons = Array.from(document.querySelectorAll('[data-theme-toggle]'));
      const updateButtons = () => {
        const detail = window.__apexThemeState || { theme: 'system', resolved: 'light' };
        const label = 'Theme';
        const resolvedLabel = detail.resolved === 'dark' ? 'Night' : 'Day';
        buttons.forEach((button) => {
          button.querySelector('[data-theme-toggle-text]').textContent = label;
          button.querySelector('[data-theme-toggle-state]').textContent = resolvedLabel;
        });
      };
      buttons.forEach((button) => {
        button.addEventListener('click', () => {
          window.ApexTheme?.cycleTheme?.();
          updateButtons();
        });
      });
      document.addEventListener('apex:themechange', updateButtons);
      updateButtons();
    })();
  </script>
</body>
</html>
