<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ApexIntel{% endblock %}</title>
  <link rel="preload" href="/static/fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    @font-face { font-family: 'ApexIntel'; src: url('/static/fonts/InterVariable.woff2') format('woff2-variations'); font-weight: 100 900; font-display: swap; }
    @font-face { font-family: 'ApexIntel'; src: url('/static/fonts/InterVariable-Italic.woff2') format('woff2-variations'); font-weight: 100 900; font-style: italic; font-display: swap; }
    @font-face { font-family: 'JetBrainsMono'; src: url('/static/fonts/JetBrainsMono-Variable.ttf') format('truetype-variations'); font-weight: 100 800; font-display: swap; }
    :root { --font-apex: 'ApexIntel', ui-sans-serif, system-ui, sans-serif; }
  </style>
  <script>
    (function(){var t=localStorage.getItem("apex-theme");if(t==="dark"||(t!=="light"&&matchMedia("(prefers-color-scheme:dark)").matches)){document.documentElement.classList.add("dark");document.documentElement.setAttribute("data-theme","dark")}})();
  </script>
  <link rel="stylesheet" href="/static/css/tailwind.css">
</head>
<body class="font-sans antialiased">
  {% block content %}{% endblock %}
</body>
</html>
