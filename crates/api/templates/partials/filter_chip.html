{# ── Filter chip partial ── a single active filter with remove button ─── #}
{# Variables: label, value, param_name, base_url                          #}

{% if !value.is_empty() %}
<span class="inline-flex items-center gap-1 rounded-sm border border-rams-line bg-rams-panel px-2 py-0.5 text-[10px] font-bold uppercase tracking-[0.08em]">
  <span class="text-rams-muted">{{ label }}:</span>
  <span>{{ value }}</span>
  <a href="{{ base_url }}" hx-get="{{ base_url }}" hx-target="#main-results" hx-push-url="true"
     class="ml-0.5 text-rams-muted hover:text-rams-red" aria-label="Remove {{ label }} filter">
    <svg class="h-2.5 w-2.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
  </a>
</span>
{% endif %}
