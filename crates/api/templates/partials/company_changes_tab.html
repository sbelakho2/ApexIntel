{# ── Company changes tab partial ──────────────────────────────────────── #}

<div id="company-changes-tab">
  {% if !events.is_empty() %}
  <div class="divide-y divide-rams-line">
    {% for ev in events %}
    <div class="px-4 py-3 hover:bg-rams-panel">
      <div class="flex items-center justify-between">
        <span class="text-sm font-semibold">{{ ev.kind }}</span>
        <span class="text-[10px] text-rams-muted tabular-nums">{{ ev.date }}</span>
      </div>
      <p class="mt-1 text-[11px] text-rams-muted">{{ ev.description }}</p>
    </div>
    {% endfor %}
  </div>
  {% else %}
  <p class="px-4 py-6 text-center text-sm text-rams-muted">No recent changes recorded</p>
  {% endif %}
</div>
