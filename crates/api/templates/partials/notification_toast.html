<div id="notification-toast" class="apex-toast">
  <div class="apex-toast-header">
    <span class="apex-toast-type">INFO</span>
    <button type="button" class="apex-toast-close" onclick="this.closest('.apex-toast').style.display='none'" aria-label="Dismiss notification">&times;</button>
  </div>
  <div class="apex-toast-body">
    <p class="apex-toast-title"></p>
    <p class="apex-toast-description"></p>
  </div>
</div>
