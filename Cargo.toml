[workspace]
members = [
    "crates/core",
    "crates/crawl",
    "crates/parse",
    "crates/store",
    "crates/graph",
    "crates/stats",
    "crates/learning",
    "crates/llm",
    "crates/recipes",
    "crates/poi",
    "crates/insights",
    "crates/api",
    "crates/worker",
    "crates/shared",
    "crates/frontend",
    "crates/investigation",
    "crates/threat_intel",
    "crates/triage",
]
resolver = "2"

[workspace.lints.rust]
# Large data-model/DTO structs intentionally carry fields populated from JSON,
# SQL rows, or templates that are read through generated (serde/Askama) code.
# Dead-code warnings here are dominated by those false positives; genuinely
# unused functions/imports are still reported by the compiler and fixed.
dead_code = "allow"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
# Structural lints intentionally allowed: fixing these would require churning
# large, stable APIs (public store/worker signatures) or renaming public
# inherent `from_str` helpers used across crates, with no functional benefit.
too_many_arguments = "allow"
type_complexity = "allow"
large_enum_variant = "allow"
result_large_err = "allow"
should_implement_trait = "allow"
doc_overindented_list_items = "allow"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# HTTP
reqwest = { version = "0.12", default-features = false, features = ["json", "gzip", "brotli", "socks", "cookies", "rustls-tls"] }
axum = { version = "0.7", features = ["ws", "multipart"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip", "fs"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Database
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "macros", "migrate", "tls-rustls"] }

# HTML parsing
scraper = "0.21"
quick-xml = "0.37"

# Hashing
sha2 = "0.10"
hex = "0.4"
sha1 = "0.10"
# Password hashing (Argon2id, PHC string format)
argon2 = "0.5"

# Rate limiting
governor = "0.7"

# DNS
hickory-resolver = "0.25"

# Search
tantivy = "0.22"
fst = "0.4"

# Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Random
rand = "0.8"

# Error handling
anyhow = "1"
thiserror = "1"

# Async traits
async-trait = "0.1"

# UUID
uuid = { version = "1", features = ["v4", "v5", "serde"] }

# Language detection
whatlang = "0.16"

# Message queue
async-nats = "0.38"

# Object storage
aws-sdk-s3 = "1"
aws-config = "1"

# URL handling
url = "2"

# Regex
regex = "1"

# Encoding
encoding_rs = "0.8"
urlencoding = "2"

# Unicode
unicode-normalization = "0.1"

# pgvector (PostgreSQL vector extension)
pgvector = { version = "0.4", features = ["sqlx"] }

# Redis
redis = { version = "0.27", default-features = false, features = ["tokio-comp", "connection-manager"] }

# Config
dotenvy = "0.15"

# PDF Generation
printpdf = "0.7"

# Temporary files (dev/test)
tempfile = "3"

# OAuth2
oauth2 = "4"

# Secrets management
secrecy = { version = "0.10", features = ["serde"] }

# Threat Intelligence
apex-threat-intel = { path = "crates/threat_intel" }
