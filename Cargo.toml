[workspace]
members = [
    "crates/core",
    "crates/crawl",
    "crates/parse",
    "crates/store",
    "crates/graph",
    "crates/stats",
    "crates/learning",
    "crates/llm",
    "crates/recipes",
    "crates/poi",
    "crates/insights",
    "crates/api",
    "crates/worker",
]
resolver = "2"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP
reqwest = { version = "0.12", features = ["json", "gzip", "brotli", "socks", "cookies"] }
axum = { version = "0.7", features = ["ws", "multipart"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json"] }

# HTML parsing
scraper = "0.21"
quick-xml = "0.37"

# Hashing
sha2 = "0.10"
hex = "0.4"

# Rate limiting
governor = "0.7"

# DNS
hickory-resolver = "0.25"

# Search
tantivy = "0.22"

# Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Random
rand = "0.8"

# Error handling
anyhow = "1"
thiserror = "1"

# Async traits
async-trait = "0.1"

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Language detection
whatlang = "0.16"

# Message queue
async-nats = "0.38"

# Object storage
aws-sdk-s3 = "1"
aws-config = "1"

# URL handling
url = "2"

# Regex
regex = "1"

# Config
dotenvy = "0.15"
