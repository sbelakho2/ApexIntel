# ──────────────────────────────────────────────────
# Phase 2: Supervised Fine-Tuning (SFT)
# Chat-format instruction tuning on 10 ApexIntel tasks
# LoRA stacked on top of Phase 1 adapter
# 8×RTX 5090 (32 GB each) — FSDP FULL_SHARD (no CPU offload)
# ──────────────────────────────────────────────────
phase: 2
name: sft_instruction_tuning

model:
  name_or_path: ./models/base
  torch_dtype: bfloat16
  attn_implementation: sdpa
  # Merge Phase 1 adapter first, then apply fresh LoRA
  phase1_adapter: ./training/outputs/phase1_dapt/best_adapter

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0
  # Attention-only LoRA for Phase 2 SFT.
  # Qwen3-30B-A3B is MoE — gate/up/down_proj exist in both shared_expert
  # (dense) and experts (×128 routed). PEFT cannot handle stacked expert
  # modules cleanly. The FFN layers were already adapted in Phase 1 DAPT.
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
  task_type: CAUSAL_LM
  bias: none

training:
  output_dir: ./training/outputs/phase2_sft
  num_train_epochs: 5
  per_device_train_batch_size: 2       # 2 GPUs × 2 × 16 = 64 effective batch
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 16      # effective batch = 2×2×16 = 64
  learning_rate: 8.0e-6
  weight_decay: 0.01
  warmup_ratio: 0.05
  lr_scheduler_type: cosine
  max_grad_norm: 1.0
  bf16: true
  logging_steps: 5
  save_strategy: steps
  save_steps: 50
  save_total_limit: 3
  eval_strategy: steps
  eval_steps: 50
  load_best_model_at_end: true
  metric_for_best_model: eval_loss
  greater_is_better: false
  dataloader_num_workers: 8
  dataloader_pin_memory: true
  dataloader_prefetch_factor: 4
  dataloader_persistent_workers: true
  max_seq_length: 4096
  report_to: none
  run_name: apexintel-sft-phase2-v3
  # FSDP is configured via accelerate_fsdp_8gpu.yaml — no deepspeed needed
  gradient_checkpointing: true
  ddp_find_unused_parameters: false
  neftune_noise_alpha: 5.0              # NEFTune: noise embedding for better generalization

data:
  train_file: ./training/data/sft_train.jsonl
  eval_file: ./training/data/sft_eval.jsonl
  chat_template: qwen                   # uses model's native chat template
  max_seq_length: 4096
