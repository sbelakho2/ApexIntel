# ApexIntel local development stack.
# Usage: docker compose up -d
# Docs: DEPLOYMENT.md
#
# Images are pinned by tag AND digest. To bump one, change the tag and refresh
# the digest with:
#   docker buildx imagetools inspect <image>:<tag> --format '{{json .Manifest.Digest}}'
# Exception: the MinIO registry requires authentication to read manifests, so
# the two minio images below are tag-pinned only. With `docker login` active,
# resolve their digests and append `@sha256:...` the same way.

version: "3.9"

services:
  # ─── PostgreSQL with TimescaleDB + pgvector ───────────────────────────
  postgres:
    # Pinned to an existing tag. The previous `2.17-pg16` tag does not exist
    # on Docker Hub, so `docker compose up` failed before starting. This image
    # ships the `vector`, `pg_trgm`, `btree_gist` and `uuid-ossp` extensions
    # required by migrations/000 and migrations/024.
    image: timescale/timescaledb:2.30.1-pg16@sha256:f495f2bc25ca7596ca8e1606c6241ca250ccc56a0c082b9f2ec0d290e0126cd9
    environment:
      POSTGRES_DB: apexintel
      POSTGRES_USER: apexintel
      # WARNING: Override with a strong password in production via .env or export DB_PASSWORD
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env or export it}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Migrations are owned by the application (`sqlx::migrate!` runs at API
      # startup and records checksums in `_sqlx_migrations`). Mounting them into
      # /docker-entrypoint-initdb.d as well would apply them raw first and leave
      # the DB in a state sqlx cannot reconcile.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apexintel"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G

  # ─── Redis (cache + rate-limit state) ─────────────────────────────────
  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    ports:
      - "127.0.0.1:6379:6379"
    # noeviction: `allkeys-lru` silently evicted login_throttle:* keys under
    # memory pressure, erasing lockouts. Better to reject writes than to lose
    # security state.
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env or export it}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env or export it}
    volumes:
      - redisdata:/data
    # REDISCLI_AUTH keeps the password out of the probe's argv, and the PONG
    # check matters: `redis-cli ping` exits 0 even on a NOAUTH error reply.
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

  # ─── NATS JetStream (message queue) ──────────────────────────────────
  nats:
    image: nats:2.10-alpine@sha256:b83efabe3e7def1e0a4a31ec6e078999bb17c80363f881df35edc70fcb6bb927
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    command: -js -sd /data -m 8222
    volumes:
      - natsdata:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

  # ─── MinIO (S3-compatible object storage) ─────────────────────────────
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in .env or export it}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env or export it}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G

  # ─── MinIO bucket init ────────────────────────────────────────────────
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in .env or export it}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env or export it}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing local/apexintel
        mc mb --ignore-existing local/apexintel-raw
        mc mb --ignore-existing local/apexintel-exports
        echo "Buckets created."
    restart: "no"

volumes:
  pgdata:
  redisdata:
  natsdata:
  miniodata:
