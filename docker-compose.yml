# ApexIntel local development stack.
# Usage: docker compose up -d
# Docs: DEPLOYMENT.md

version: "3.9"

services:
  # ─── PostgreSQL with TimescaleDB ──────────────────────────────────────
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: apexintel
      POSTGRES_USER: apexintel
      POSTGRES_PASSWORD: ${DB_PASSWORD:-apexintel_dev}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apexintel"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ─── Redis (cache + rate-limit state) ─────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # ─── NATS JetStream (message queue) ──────────────────────────────────
  nats:
    image: nats:2.10-alpine
    ports:
      - "4222:4222"
      - "8222:8222"
    command: -js -sd /data -m 8222
    volumes:
      - natsdata:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # ─── MinIO (S3-compatible object storage) ─────────────────────────────
  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-apexintel}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-apexintel_dev}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ─── MinIO bucket init ────────────────────────────────────────────────
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-apexintel} $${MINIO_ROOT_PASSWORD:-apexintel_dev};
        mc mb --ignore-existing local/apexintel;
        mc mb --ignore-existing local/apexintel-raw;
        mc mb --ignore-existing local/apexintel-exports;
        echo 'Buckets created.';
      "
    restart: "no"

volumes:
  pgdata:
  redisdata:
  natsdata:
  miniodata:
