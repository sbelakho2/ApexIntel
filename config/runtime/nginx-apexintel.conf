# ApexIntel – starzerp.fi
# Rust/Axum serves HTML + API + static (no more Next.js)

upstream apexintel_api {
    # Primary upstream server with health check parameters
    server 127.0.0.1:8080 max_fails=5 fail_timeout=30s;
    keepalive 16;
}

server {
    server_name starzerp.fi www.starzerp.fi;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Content Security Policy — restricts script/style sources to prevent XSS
    add_header Content-Security-Policy "
        default-src 'self';
        script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net;
        style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net;
        font-src 'self' https://cdn.jsdelivr.net data:;
        img-src 'self' data:;
        connect-src 'self' https://api.starzerp.fi wss://api.starzerp.fi;
        frame-ancestors 'none';
        base-uri 'self';
        form-action 'self';
    " always;

    # HTTP Strict Transport Security — forces HTTPS for 1 year, includes subdomains
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Permissions Policy — restrict browser features
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    # Prevent embedding in iframes
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Logging
    access_log /var/log/nginx/apexintel_access.log;
    error_log  /var/log/nginx/apexintel_error.log;

    # Static assets — served by nginx directly with long cache
    location /static/ {
        alias /opt/apexintel/static/;
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000";
        access_log off;
    }

    # WebSocket support
    location /ws/ {
        proxy_pass http://apexintel_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    # API routes (JSON endpoints)
    location /api/ {
        proxy_pass http://apexintel_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 60s;
        client_max_body_size 1m;

        # CORS for API consumers — restricted to known origins, never reflect $http_origin
        add_header Access-Control-Allow-Origin "https://starzerp.fi" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Api-Key" always;
        add_header Access-Control-Allow-Credentials "true" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # Everything else — Rust/Axum (HTML pages + login/logout)
    location / {
        proxy_pass http://apexintel_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
    }

    # Deny access to dotfiles (except .well-known for Let's Encrypt)
    location ~ /\.(?!well-known) {
        deny all;
    }

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/starzerp.fi/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/starzerp.fi/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name starzerp.fi www.starzerp.fi;
    return 301 https://$server_name$request_uri;
}
