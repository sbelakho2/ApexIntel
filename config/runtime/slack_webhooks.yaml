# Slack Webhook Configuration for ApexIntel
#
# Multiple webhook URLs for different channels. Each channel maps to a Slack
# Incoming Webhook URL. Messages are routed based on alert type.
#
# Environment variables override these settings (the surviving, single set —
# the older SLACK_WEBHOOK_URLS / SLACK_WEBHOOK_CHANNEL_* variables were
# removed; channel routing below is file-based):
#   SLACK_WEBHOOK_URL              - default webhook URL
#   SLACK_WEBHOOK_FORMAT           - payload format: slack | teams | json
#   SLACK_WEBHOOK_TIMEOUT_SECS     - timeout (default: 10)
# ---------------------------------------------------------------------------
timeout_secs: 10

# Default webhook URLs used when no channel-specific match is found.
default_urls:
  - "https://hooks.slack.com/services/T00/B00/EXAMPLE"

# Per-channel routing based on alert type.
channels:
  # Security-critical alerts (breaches, vulnerabilities, sanctions, etc.)
  security:
    - "https://hooks.slack.com/services/T00/B01/EXAMPLE_SECURITY"

  # Competitive intelligence insights
  insight:
    - "https://hooks.slack.com/services/T00/B02/EXAMPLE_INSIGHT"

  # Recipe match / opportunity alerts
  recipe_match:
    - "https://hooks.slack.com/services/T00/B03/EXAMPLE_RECIPE"

  # Person-of-interest updates
  poi_update:
    - "https://hooks.slack.com/services/T00/B04/EXAMPLE_POI"

  # Warning verification results
  warning:
    - "https://hooks.slack.com/services/T00/B05/EXAMPLE_WARNING"

  # General / uncategorized alerts
  general:
    - "https://hooks.slack.com/services/T00/B06/EXAMPLE_GENERAL"
