version: 1

routes:
  pager_webhook_env: PAGE_WEBHOOK_URL
  warning_email_env: ALERT_EMAIL_TO

rules:
  - name: api-deep-health-failed
    source: api_health_deep
    condition: status != ok
    severity: critical
    for: 2m
    notify:
      - pager_webhook
      - email

  - name: api-5xx-rate-high
    source: http_requests_total
    condition: rate({status=~"5.."}[5m]) / rate({status=~".*"}[5m]) > 0.01
    severity: critical
    for: 5m
    notify:
      - pager_webhook
      - email

  - name: worker-job-failures
    source: worker_job_state
    condition: consecutive_failures >= 3 or circuit_open == true
    severity: critical
    for: 5m
    notify:
      - pager_webhook
      - email

  - name: worker-crawl-success-low
    source: crawl_success_total
    condition: sum(rate(crawl_success_total[1h])) / sum(rate(crawl_attempts_total[1h])) < 0.20
    severity: warning
    for: 15m
    notify:
      - pager_webhook

  - name: llm-server-down
    source: llm_request_duration_seconds_count
    condition: absent(llm_request_duration_seconds_count) == 1
    severity: critical
    for: 5m
    notify:
      - pager_webhook
      - email

  - name: backup-missing
    source: backup_timer
    condition: last_success_age_hours > 26
    severity: critical
    for: 10m
    notify:
      - pager_webhook

  - name: backup-restore-validation-failed
    source: restore_validate
    condition: status != ok
    severity: critical
    for: 0m
    notify:
      - pager_webhook
      - email

  - name: disk-usage-high
    source: node_filesystem_avail_bytes
    condition: (node_filesystem_size_bytes - node_filesystem_avail_bytes) / node_filesystem_size_bytes > 0.85
    severity: warning
    for: 10m
    notify:
      - email

  - name: memory-usage-high
    source: node_memory_MemTotal_bytes
    condition: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes > 0.90
    severity: warning
    for: 10m
    notify:
      - email

  - name: redis-down
    source: redis_up
    condition: redis_up == 0
    severity: critical
    for: 1m
    notify:
      - pager_webhook
      - email

  - name: nats-down
    source: nats_up
    condition: nats_up == 0
    severity: critical
    for: 1m
    notify:
      - pager_webhook
      - email

  - name: minio-down
    source: minio_up
    condition: minio_up == 0
    severity: critical
    for: 1m
    notify:
      - pager_webhook
      - email

  - name: postgres-connection-pool-exhaustion
    source: pg_pool_connections
    condition: pg_pool_connections_used / pg_pool_connections_total > 0.90
    severity: critical
    for: 2m
    notify:
      - pager_webhook
      - email

  # ─── Domain-Level Alert Rules ─────────────────────────────────────────
  #
  # These rules monitor business/domain signals generated by the
  # intelligence pipeline, not just infrastructure health.

  - name: new-critical-warnings-surge
    source: warning_count
    condition: sum(rate(warning_count_total{severity="critical"}[15m])) > 50
    severity: critical
    for: 5m
    notify:
      - pager_webhook
      - email

  - name: new-high-priority-warnings-surge
    source: warning_count
    condition: sum(rate(warning_count_total{severity="high"}[15m])) > 100
    severity: warning
    for: 5m
    notify:
      - email

  - name: insight-generation-dropped
    source: insights_generated_total
    condition: rate(insights_generated_total[1h]) < rate(insights_generated_total[1h] offset 24h) * 0.5
    severity: warning
    for: 30m
    notify:
      - email

  - name: weekly-memo-missed
    source: worker_job_state
    condition: job_type == "weekly" and consecutive_failures >= 2
    severity: warning
    for: 0m
    notify:
      - email

  - name: sanctions-match-high
    source: sanctions_matches_total
    condition: rate(sanctions_matches_total[1h]) > 10
    severity: critical
    for: 5m
    notify:
      - pager_webhook
      - email

  - name: sanctions-match-medium
    source: sanctions_matches_total
    condition: rate(sanctions_matches_total[1h]) > 3
    severity: warning
    for: 10m
    notify:
      - email

  - name: geopolitical-escalation
    source: geopolitical_risk_score
    condition: risk_level == "critical" or risk_level == "high"
    severity: warning
    for: 5m
    notify:
      - email

  - name: poi-discovery-stalled
    source: poi_discovery_total
    condition: rate(poi_discovery_total[6h]) == 0 and rate(poi_crawl_attempts_total[6h]) > 0
    severity: warning
    for: 1h
    notify:
      - email

  - name: supplier-risk-critical
    source: supplier_risk_score
    condition: risk_level == "critical"
    severity: critical
    for: 5m
    notify:
      - pager_webhook
      - email

  - name: replay-queue-growing
    source: replay_queue_depth
    condition: replay_queue_depth > 1000
    severity: warning
    for: 10m
    notify:
      - email

  - name: recipe-mine-success-low
    source: recipe_mining_total
    condition: rate(recipe_mining_success_total[1h]) / rate(recipe_mining_attempts_total[1h]) < 0.5
    severity: warning
    for: 30m
    notify:
      - email