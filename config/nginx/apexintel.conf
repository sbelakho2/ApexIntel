# ────────────────────────────────────────────────────────────────────────────
# ApexIntel Nginx Reverse Proxy Configuration
# Install: ln -sf /opt/apexintel/config/nginx/apexintel.conf /etc/nginx/sites-enabled/
# Test:    nginx -t && systemctl reload nginx
# ────────────────────────────────────────────────────────────────────────────

upstream apexintel_api {
    server 127.0.0.1:8080;
    keepalive 32;
}

upstream apexintel_frontend {
    server 127.0.0.1:3000;
    keepalive 16;
}

# Rate-limit zones
limit_req_zone $binary_remote_addr zone=api_global:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api_search:5m  rate=5r/s;

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name starzerp.fi www.starzerp.fi;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name starzerp.fi www.starzerp.fi;

    # ─── TLS (Certbot-managed) ─────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/starzerp.fi/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/starzerp.fi/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ─── Security headers ──────────────────────────────────────────────
    add_header X-Frame-Options            "SAMEORIGIN"                     always;
    add_header X-Content-Type-Options     "nosniff"                        always;
    add_header X-XSS-Protection           "1; mode=block"                  always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security  "max-age=63072000; includeSubDomains; preload" always;
    add_header Content-Security-Policy    "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' wss://starzerp.fi https://starzerp.fi;" always;
    add_header Permissions-Policy         "camera=(), microphone=(), geolocation=()" always;

    # ─── Gzip ──────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain application/json application/javascript text/css application/xml;
    gzip_min_length 1000;
    gzip_vary on;

    # ─── API routes ────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api_global burst=50 nodelay;

        proxy_pass http://apexintel_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;
        proxy_send_timeout    60s;
        proxy_buffering on;
        proxy_buffer_size   8k;
        proxy_buffers       8 8k;
    }

    # ─── Search endpoint (tighter rate limit) ──────────────────────────
    location /api/search {
        limit_req zone=api_search burst=10 nodelay;

        proxy_pass http://apexintel_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ─── WebSocket for real-time warnings ──────────────────────────────
    location /ws/ {
        proxy_pass http://apexintel_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_read_timeout 86400;
    }

    # ─── Prometheus (internal only) ────────────────────────────────────
    location /metrics {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://apexintel_api/metrics;
    }

    # ─── Static Next.js assets (immutable cache) ──────────────────────
    location /_next/static/ {
        proxy_pass http://apexintel_frontend;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ─── Frontend catch-all ────────────────────────────────────────────
    location / {
        proxy_pass http://apexintel_frontend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── Logging ───────────────────────────────────────────────────────
    access_log /var/log/nginx/apexintel_access.log;
    error_log  /var/log/nginx/apexintel_error.log;
}
