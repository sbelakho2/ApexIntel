recipes:
  # ============================================================================
  # CATEGORY A: Demand & Procurement Intelligence (A001-A050)
  # ============================================================================
  - id: A001
    name: new_sourcing_cycle_starting
    category: demand_procurement
    join: Entity
    outcome: RfQPosted
    signals:
      - JobPost.role_family=Procurement.increase
      - WebChange.supplier_portal
    transforms:
      - type: Lag
        days: 30
      - type: Count
        window_days: 14
    test:
      type: FisherExact
    thresholds:
      min_effect: 1.5
      max_p_value: 0.01
      min_stability: 0.75
      max_false_alarm_rate: 0.02
    narrative_template: >
      {{evidence:company_name}} is showing signs of a new sourcing cycle. 
      We detected {{evidence:job_count}} procurement-related job postings in the past 2 weeks,
      combined with updates to their supplier portal ({{evidence:portal_url}}). 
      This typically precedes RFQ activity by 30-60 days.
    action_playbook:
      - Register on supplier portal immediately
      - Send updated capabilities deck to procurement contact
      - Schedule introductory call with SQE team
      - Prepare qualification documents (PPAP, IMDS if automotive)
    applicability:
      geos: [TN, MA, EU, US, IL, CN, TW, KR, JP]
      industries: [automotive, aerospace, industrial, medical, energy]
      notes: High confidence for OEMs and Tier 1s

  - id: A002
    name: qualification_round_imminent
    category: demand_procurement
    join: Entity
    outcome: RfQPosted
    signals:
      - Tender.public.posted
      - JobPost.role_family=SQE.increase
    transforms:
      - type: Lag
        days: 45
      - type: Count
        window_days: 30
    test:
      type: FisherExact
    thresholds:
      min_effect: 1.8
      max_p_value: 0.01
      min_stability: 0.8
      max_false_alarm_rate: 0.02
    narrative_template: >
      Public tender detected at {{evidence:company_name}} ({{evidence:tender_title}})
      with deadline {{evidence:tender_deadline}}. Simultaneously, SQE hiring activity
      increased by {{evidence:sqe_job_delta}}%, indicating qualification round preparation.
    action_playbook:
      - Prepare complete audit package
      - Submit bid before deadline
      - Contact SQE lead for pre-qualification meeting
      - Ensure all certifications are current
    applicability:
      geos: [TN, MA, EU, US, IL, CN, TW, KR, JP]
      industries: [automotive, aerospace, industrial, medical]
      notes: Especially relevant for public sector and large OEMs

  - id: A003
    name: automotive_qualification_opening
    category: demand_procurement
    join: Entity
    outcome: RfQPosted
    signals:
      - CertificationUpdate.new.IATF_16949
      - Tender.sector=automotive
    transforms:
      - type: Lag
        days: 60
    test:
      type: FisherExact
    thresholds:
      min_effect: 2.0
      max_p_value: 0.01
      min_stability: 0.7
      max_false_alarm_rate: 0.02
    narrative_template: >
      {{evidence:company_name}} recently obtained IATF 16949 certification 
      (effective {{evidence:cert_date}}) and has posted automotive tenders.
      This creates an opening for new qualified automotive suppliers.
    action_playbook:
      - Fast-track IATF preparation if not certified
      - Contact their SQE with your IATF certificate
      - Emphasize automotive track record
      - Offer PPAP support
    applicability:
      geos: [TN, MA, EU, US, MX, CN, TW, KR, JP]
      industries: [automotive]
      notes: Critical for automotive market entry

