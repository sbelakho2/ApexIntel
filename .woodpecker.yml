# Woodpecker CI pipeline for ApexIntel.
#
# Contract — every step must be green:
#   1. rustfmt check
#   2. clippy over all targets with warnings denied, for the default feature
#      set AND the full feature matrix (`--all-features`: llm,
#      llm-tool-calling, experimental, full, parse)
#   3. full workspace test suite for both feature sets
#   4. release build
#   5. Tailwind asset build
#   6. wasm32 check of the shared crate used by the browser UI
#
# All cargo invocations use `--locked` so a stale Cargo.lock fails the build
# instead of being silently regenerated. Tests require no external services:
# the store layer is exercised through fakes, so no `services:` block is
# needed. If a future test needs PostgreSQL/Redis/NATS, add one here.

when:
  - event: [push, pull_request, tag, manual]

steps:
  - name: rust
    image: rust:bookworm
    environment:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
    commands:
      - rustup component add rustfmt clippy
      # Formatting
      - cargo fmt --all -- --check
      # Lint: default features
      - cargo clippy --workspace --all-targets --locked -- -D warnings
      # Lint: full feature matrix
      - cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # Tests: default features
      - cargo test --workspace --locked --no-fail-fast
      # Tests: full feature matrix
      - cargo test --workspace --all-features --locked --no-fail-fast
      # Release build of the deployable binaries (the Docker images ship these).
      - cargo build --release --bins -p apex-api -p apex-worker --locked

  - name: frontend-assets
    image: node:20-bookworm
    commands:
      - npm ci
      # The compiled stylesheet is committed; rebuild it to prove the Tailwind
      # config and source CSS still produce output.
      - npx tailwindcss -i crates/api/static/css/globals.css -o /tmp/tailwind.css --minify

  - name: wasm-shared
    image: rust:bookworm
    environment:
      # Isolated target dir so this step never contends with the native build.
      CARGO_TARGET_DIR: /woodpecker/target-wasm
    commands:
      - rustup target add wasm32-unknown-unknown
      - cargo check -p apex-shared --target wasm32-unknown-unknown --locked
