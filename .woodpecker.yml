# Woodpecker CI pipeline for ApexIntel.
#
# Contract — every step must be green:
#   1. rustfmt check
#   2. clippy over all targets with warnings denied, for the default feature
#      set AND the full feature matrix
#   3. full workspace test suite for both feature sets
#   4. release build of the deployable binaries
#   5. database migrations applied to a real PostgreSQL service (bootstraps a
#      fresh database)
#   6. Tailwind asset build
#   7. wasm32 check of the shared crate used by the browser UI
#   8. server-rendered UI end-to-end (Playwright): logs in and sweeps EVERY
#      navigation route at mobile + desktop, asserting HTTP 2xx, no console /
#      page errors, no horizontal overflow (the "vertical text" class of bug),
#      data-table cells stay on one line on mobile, the styled 404 works, and
#      every rendered link resolves.
#
# All cargo invocations use `--locked` so a stale Cargo.lock fails the build.

when:
  - event: [push, pull_request, tag, manual]

# PostgreSQL used to validate migrations bootstrap a fresh database and by the
# UI e2e run. Must provide `vector`, `pg_trgm`, `btree_gist`, `uuid-ossp`.
services:
  database:
    image: timescale/timescaledb:2.30.1-pg16
    environment:
      POSTGRES_DB: apex_ci
      POSTGRES_USER: apex
      POSTGRES_PASSWORD: apex

steps:
  # Fails if unrelated-project artifacts or generated output are tracked.
  - name: repo-contamination
    image: alpine:3.20
    commands:
      - apk add --no-cache git bash
      - bash scripts/ci/check_repo_contamination.sh

  # Fails if a worker job bypasses the shared warning ingress and calls
  # `store.insert_warning(...)` directly (skipping semantic triage dedup).
  - name: warning-ingress-guard
    image: alpine:3.20
    commands:
      - apk add --no-cache bash grep
      - bash scripts/ci/check_warning_ingress.sh

  - name: rust
    image: rust:bookworm
    environment:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
    commands:
      - rustup component add rustfmt clippy
      # Formatting
      - cargo fmt --all -- --check
      # Lint: default features
      - cargo clippy --workspace --all-targets --locked -- -D warnings
      # Lint: full feature matrix
      - cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # Tests: default features
      - cargo test --workspace --locked --no-fail-fast
      # Tests: full feature matrix
      - cargo test --workspace --all-features --locked --no-fail-fast
      # Release build of the deployable binaries (the Docker images ship these)
      - cargo build --release --bins -p apex-api -p apex-worker --features llm --locked

  - name: frontend-assets
    image: node:20-bookworm
    commands:
      - npm ci
      # The compiled stylesheet is committed; rebuild it to prove the Tailwind
      # config and source CSS still produce output.
      - npx tailwindcss -i crates/api/static/css/globals.css -o /tmp/tailwind.css --minify

  # Bootstraps a real, empty PostgreSQL and applies every migration via sqlx.
  - name: migrations
    image: rust:bookworm
    depends_on: [rust]
    environment:
      TEST_DATABASE_URL: postgres://apex:apex@database:5432/apex_ci
    commands:
      - until bash -c 'echo > /dev/tcp/database/5432' 2>/dev/null; do sleep 1; done
      - cargo test -p apex-store --test migrations_integration --test alert_subscriptions_integration --test alert_subscription_crud_integration --test rls_scoped_integration --locked -- --ignored --test-threads=1
      # Canonical `app_users` login contract against the same migrated database.
      - cargo test -p apex-api --test app_users_login_integration --locked -- --ignored --test-threads=1

  - name: wasm-shared
    image: rust:bookworm
    # Compile-heavy steps run sequentially: concurrent cargo builds on a small
    # runner caused intermittent failures in the api test suite.
    depends_on: [rust]
    commands:
      - rustup target add wasm32-unknown-unknown
      - cargo check -p apex-shared --target wasm32-unknown-unknown --locked

  # Server-rendered UI end-to-end. Builds the API (rust image also has Node),
  # starts it against the database service, and drives a real browser.
  - name: e2e-server-ui
    image: rust:bookworm
    depends_on: [rust, migrations]
    environment:
      DATABASE_URL: postgres://apex:apex@database:5432/apex_ci
      APEX_ADMIN_USERNAME: admin
      APEX_ADMIN_PASSWORD_HASH: 749f09bade8aca755660eeb17792da880218d4fbdc4e25fbec279d7fe9f65d70
      SESSION_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      SEARCH_INDEX_PATH: /tmp/apex-index
      RATE_LIMIT_DISABLED: "true"
      HOST: 127.0.0.1
      PORT: "9095"
    commands:
      # Container networks can be flaky; retry the package fetch and use
      # apt's own retry support before giving up.
      - >-
        for i in 1 2 3 4 5; do
        apt-get -o Acquire::Retries=5 update &&
        apt-get -o Acquire::Retries=5 install -y --no-install-recommends nodejs npm cmake clang && break;
        echo "apt attempt $i failed; retrying"; sleep 10; done
      - node --version && npm --version
      - npm ci
      - npx playwright install --with-deps chromium
      - until bash -c 'echo > /dev/tcp/database/5432' 2>/dev/null; do sleep 1; done
      - cargo build --release --bin apex-api --features llm --locked
      - ./target/release/apex-api & sleep 6
      - curl -sf http://127.0.0.1:9095/api/health
      # Production artifact must advertise the LLM capability.
      - curl -sf http://127.0.0.1:9095/api/features | grep -q '"llm_enabled":true'
      - BASE_URL=http://127.0.0.1:9095 ADMIN_USER=admin ADMIN_PASS=adminpassword node scripts/ci/e2e_server_ui.mjs
