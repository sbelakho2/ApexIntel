# Woodpecker CI pipeline for ApexIntel.
#
# Container images are pinned by tag AND digest so a re-tagged upstream cannot
# change what CI runs. To bump an image: change the tag and refresh the digest
# with `docker buildx imagetools inspect <image>:<tag> --format '{{json .Manifest.Digest}}'`.
#
# Contract — every step must be green:
#   1. rustfmt check
#   2. clippy over all targets with warnings denied, for the default feature
#      set AND the full feature matrix
#   3. full workspace test suite for both feature sets
#   4. release build of the deployable binaries
#   5. database migrations applied to a real PostgreSQL service (bootstraps a
#      fresh database) AND every other `#[ignore = "requires PostgreSQL"]`
#      suite in the workspace, run through the canonical runner
#      scripts/ci/run_pg_integration_suites.sh
#   6. a registration guard that fails when a new ignored PostgreSQL test target
#      is not wired into that runner
#   7. Tailwind asset build
#   8. server-rendered UI end-to-end (Playwright) smoke sweep: logs in and sweeps
#      EVERY navigation route at mobile + desktop, asserting HTTP 2xx, no
#      console / page errors, no horizontal overflow (the "vertical text" class
#      of bug), data-table cells stay on one line on mobile, the styled 404
#      works, and every rendered link resolves.
#   9. server-rendered UI journey contracts (Playwright): drives the real UI and
#      asserts the resulting PostgreSQL state for create/save/delete/ack/
#      resolve/dismiss/bookmark/recipe/investigation/export/preferences/
#      subscription/graph/battlecard/admin journeys.
#  10. container-level browser integration: builds Dockerfile.worker's
#      browser-check stage (runtime image + Chromium) and renders a JS-only
#      fixture (late network + lazy-loaded DOM) through that image.
#  11. migration identity check: every pending migration states its own number
#      in the header and everywhere else in its comments / SQL string literals,
#      so a renumbered file cannot keep describing an older revision; the
#      production-applied files are frozen and explicitly allowlisted in
#      scripts/ci/frozen_migrations.txt.
#  12. single-frontend guard: the retired WASM SPA crate (`experiments/wasm-frontend`)
#      must not reappear in the workspace, CI, or tests — production is the
#      server-rendered Askama + HTMX UI in `crates/api`.
#  13. release evidence bundle (scripts/ci/release_evidence.sh) for the exact
#      commit SHA: executed gates plus the gates owned by the steps above,
#      artifact digests and timestamps, written to release-evidence/<sha>/.
#  14. secret scanning (gitleaks) over the checked-out tree, and dependency
#      license/advisory checks (cargo-deny). Licenses are blocking; advisories
#      report the known Cargo.lock debt non-blockingly until the dependency
#      bump lands (see deny.toml for the pinned ignore rationale).
#  15. unused-public-API guard: `RUSTFLAGS="-W unreachable_pub"` over the whole
#      workspace and all targets; the step fails when any `pub` item is only
#      reachable within its own crate (stable rustc lint; see
#      scripts/ci/check_unused_public_items.sh).
#
# Runtime readiness additionally proves the schema lineage (applied migration
# head == embedded head + checksum verification) through the `schema`
# capability in /api/health/capabilities and `schema_lineage` in
# /api/health/ready.
#
# The Rust toolchain is pinned twice for the same version: rust-toolchain.toml
# (1.98.0) for local builds and the `rust:1.98.0-bookworm` image tag for CI.
#
# All cargo invocations use `--locked` so a stale Cargo.lock fails the build.

when:
  - event: [push, pull_request, tag, manual]

# Pin every workflow to the container-capable arm64 agent. Without this the
# scheduler may hand the run to the host-mode `local` agent, which cannot run
# the postgres/redis service containers, producing a false "database: failure".
labels:
  platform: linux/arm64

# PostgreSQL used to validate migrations bootstrap a fresh database and by the
# UI e2e run. Must provide `vector`, `pg_trgm`, `btree_gist`, `uuid-ossp`.
services:
  database:
    image: timescale/timescaledb:2.30.1-pg16@sha256:f495f2bc25ca7596ca8e1606c6241ca250ccc56a0c082b9f2ec0d290e0126cd9
    environment:
      POSTGRES_DB: apex_ci
      POSTGRES_USER: apex
      POSTGRES_PASSWORD: apex
  # Verifies the optional Redis login-throttle backend (used when REDIS_URL is
  # configured in production).
  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499

steps:
  # Fails if unrelated-project artifacts or generated output are tracked.
  - name: repo-contamination
    image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
    commands:
      - apk add --no-cache git bash
      - bash scripts/ci/check_repo_contamination.sh

  # Fails when the CPV 2008 reference dataset is not the official 9,454-row
  # `code,description` CSV. The previous revision was a saved HTML page, so a
  # malformed/truncated dataset must never reach the training pipeline again.
  - name: dataset-formats
    image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
    commands:
      - apk add --no-cache bash grep
      - bash scripts/ci/check_dataset_formats.sh

  # Fails when a `#[ignore = "requires PostgreSQL"]` test target exists that the
  # canonical PostgreSQL runner does not execute — adding a suite can never
  # silently skip CI again.
  - name: pg-suite-registration
    image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
    commands:
      - apk add --no-cache bash grep findutils
      - bash scripts/ci/check_pg_test_coverage.sh

  # Fails if a worker job bypasses the shared warning ingress and calls
  # `store.insert_warning(...)` directly (skipping semantic triage dedup).
  - name: warning-ingress-guard
    image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
    commands:
      - apk add --no-cache bash grep
      - bash scripts/ci/check_warning_ingress.sh

  # Fails if storage failures are converted into neutral defaults in the
  # sensitive request/job paths (audit P0 #22).
  - name: sensitive-defaults-guard
    image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
    commands:
      - apk add --no-cache bash grep
      - bash scripts/ci/check_sensitive_defaults.sh

  # Fails if DEPLOYMENT.md loses the docs contract (build flags, placeholders,
  # two-role DB contract, redacted production identifiers).
  - name: docs-contract
    image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
    commands:
      - apk add --no-cache bash grep
      - bash scripts/ci/check_docs_contract.sh

  # Backstop against fabricated analytics in production handlers/templates
  # (seeded arrays, demo values, trigonometric "trends").
  - name: fabricated-metrics-guard
    image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
    commands:
      - apk add --no-cache bash grep python3
      - bash scripts/ci/check_fabricated_metrics.sh

  # False-success + identifier-decode guards.
  # The suppression rule is semantic and asymmetric: an authoritative store
  # call that discards or defaults its error fails with "authoritative
  # operation still suppresses error" regardless of comments; only a reasoned
  # entry in scripts/ci/false_success_allowlist.txt permits a telemetry-only
  # discard. Identifier decodes may never fall back to the nil UUID / a fresh
  # UUID / zero/empty defaults for id-like fields.
  - name: false-success-guard
    image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
    commands:
      - apk add --no-cache bash python3
      - bash scripts/ci/check_false_success.sh --self-test
      - bash scripts/ci/check_false_success.sh
      - bash scripts/ci/check_identifier_decode.sh --self-test
      - bash scripts/ci/check_identifier_decode.sh

  # Fails if a migration header or body comment describes a different revision
  # than its filename (audit #40 + stale body numbering). Production-applied
  # migrations (000..078) are frozen and explicitly allowlisted in
  # scripts/ci/frozen_migrations.txt. Also fails on a migration that opens its
  # own explicit transaction (sqlx wraps each migration) and on a second
  # migrations folder reappearing anywhere in the workspace.
  - name: migration-headers
    image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
    commands:
      - apk add --no-cache bash grep
      - bash scripts/ci/check_migration_headers.sh migrations
      - bash scripts/ci/check_migration_no_explicit_tx.sh
      - bash scripts/ci/check_single_migrations_folder.sh
  # Fails if alert publication bypasses the transactional outbox (a direct
  # `publish_alert(...)` call from a job/pipeline loses the crash/retry/
  # dead-letter guarantees).
  - name: alert-publish-guard
    image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
    commands:
      - apk add --no-cache bash grep
      - bash scripts/ci/check_alert_publish.sh

  # Fails if the retired WASM SPA crate reappears anywhere: workspace
  # membership, CI, tests, or docs. Production UI is the server-rendered
  # Askama + HTMX application in `crates/api`.
  - name: single-frontend-guard
    image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
    commands:
      - apk add --no-cache git bash grep
      - bash scripts/ci/check_frontend_removed.sh

  # Secret scanning over the checked-out tree. `--no-git` keeps the scan on
  # committed content (the CI checkout has no local .env); .gitleaks.toml keeps
  # the default rule set and allowlists only documented test fixtures and
  # generated directories. Non-interactive; leaks exit 1.
  - name: gitleaks
    image: zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    commands:
      - gitleaks detect --source . --no-git --config .gitleaks.toml --exit-code 1 --redact --verbose

  # Dependency license policy (BLOCKING): every third-party crate must use a
  # permissive license (see deny.toml for the allowlist and the first-party
  # clarify entries). cargo-deny is pinned to the version whose config schema
  # deny.toml targets; installed from source because Woodpecker cannot run
  # GitHub actions. Each step installs into its own root: steps without
  # depends_on run in parallel, and two concurrent installs must not race on
  # the same output directory.
  - name: cargo-deny-licenses
    image: rust:1.98.0-bookworm@sha256:82150a52ec202c1b14d7817e14516c392bb7f5cfebd88f1ed531cb37ebd39922
    environment:
      CARGO_TERM_COLOR: always
    commands:
      - cargo install cargo-deny --locked --version 0.20.2 --root .ci-tools-licenses
      - .ci-tools-licenses/bin/cargo-deny check licenses

  # Advisory report (NON-BLOCKING, `failure: ignore`). The committed Cargo.lock
  # currently resolves crates with open advisories (h2, rustls-webpki,
  # quick-xml, lopdf, ...) plus the yanked spin 0.9.8; they cannot be fixed
  # without a dependency-bump change outside this step. The step publishes the
  # findings in every pipeline log without failing the build, so a NEW advisory
  # is visible immediately. deny.toml keeps `yanked = "warn"` for the same
  # reason.
  - name: cargo-deny-advisories
    image: rust:1.98.0-bookworm@sha256:82150a52ec202c1b14d7817e14516c392bb7f5cfebd88f1ed531cb37ebd39922
    failure: ignore
    environment:
      CARGO_TERM_COLOR: always
    commands:
      - cargo install cargo-deny --locked --version 0.20.2 --root .ci-tools-advisories
      - .ci-tools-advisories/bin/cargo-deny check advisories

  # Dead-code evaluation (audit item 177): `unreachable_pub` (rustc) and
  # `cargo-udeps` are nightly-only. No job is added — it cannot run on the
  # pinned stable toolchain without a second, unpinned nightly. Recommended
  # follow-up: a scheduled nightly job reporting (non-blocking)
  #   RUSTFLAGS="-W unreachable_pub" cargo +nightly check --workspace --all-targets
  #   cargo +nightly udeps --workspace --all-targets
  - name: rust
    image: rust:1.98.0-bookworm@sha256:82150a52ec202c1b14d7817e14516c392bb7f5cfebd88f1ed531cb37ebd39922
    environment:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
      # The apex-worker test binary is large enough that a debuginfo linker
      # run OOMs the CI container (ld signalled 9). Strip debuginfo and ask the
      # linker to release memory as it goes; neither changes what is verified.
      RUSTFLAGS: "-C debuginfo=0 -C link-arg=-Wl,--no-keep-memory"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      # Cap parallel rustc jobs: the apex-api/apex-worker test binaries peak
      # high enough to OOM-kill a rustc under concurrent pipeline steps.
      CARGO_BUILD_JOBS: "3"
    commands:
      - rustup component add rustfmt clippy
      # Formatting
      - cargo fmt --all -- --check
      # Lint: default features. `disallowed_methods` is allow-by-default even
      # though clippy.toml declares it repo-wide, so it must be enabled here.
      - cargo clippy --workspace --all-targets --locked -- -D warnings -W clippy::disallowed_methods
      # Lint: full feature matrix
      - cargo clippy --workspace --all-targets --all-features --locked -- -D warnings -W clippy::disallowed_methods
      # Tests: default features
      - cargo test --workspace --locked --no-fail-fast
      # Tests: full feature matrix
      - cargo test --workspace --all-features --locked --no-fail-fast
      # Release build of the deployable binaries (the Docker images ship these)
      - cargo build --release --bins -p apex-api -p apex-worker --features llm --locked

  # Unused-public-API guard (#166): `RUSTFLAGS="-W unreachable_pub"` flags a
  # `pub` item that nothing outside its crate can reach; the step fails when any
  # finding exists. Stable rustc lint, no nightly needed. Warn level (instead of
  # deny) keeps the whole workspace compiling so the complete finding list is
  # reported in one run. Runs after `rust` so the two workspace-wide cargo
  # builds do not race for memory or the target dir.
  - name: unused-public-items
    image: rust:1.98.0-bookworm@sha256:82150a52ec202c1b14d7817e14516c392bb7f5cfebd88f1ed531cb37ebd39922
    depends_on: [rust]
    environment:
      CARGO_TERM_COLOR: always
    commands:
      - bash scripts/ci/check_unused_public_items.sh

  - name: ui-assets
    image: node:20-bookworm@sha256:8f693eaa7e0a8e71560c9a82b55fd54c2ae920a2ba5d2cde28bac7d1c01c9ba5
    commands:
      - npm ci
      # The compiled stylesheet is committed; rebuild it to prove the Tailwind
      # config and source CSS still produce output.
      - npx tailwindcss -i crates/api/static/css/globals.css -o /tmp/tailwind.css --minify

  # apex-shared is the wasm-compatible boundary crate (serde/chrono only); the
  # release-evidence `wasm-shared` gate is only truthful if a step actually
  # compiles it for wasm32, so a native-only regression fails CI here.
  - name: wasm-shared
    image: rust:1.98.0-bookworm@sha256:82150a52ec202c1b14d7817e14516c392bb7f5cfebd88f1ed531cb37ebd39922
    commands:
      - rustup target add wasm32-unknown-unknown
      - cargo check -p apex-shared --target wasm32-unknown-unknown --locked

  # Bootstraps a real, empty PostgreSQL and applies every migration via sqlx,
  # then runs EVERY ignored PostgreSQL integration suite in the workspace (store
  # RLS/outbox/subscriptions/migrations, triage ingest, insight evidence, API
  # login) plus the learning evaluation gate. The suite list lives in the
  # canonical runner so local `npm run test:pg` and CI cannot drift.
  - name: migrations
    image: rust:1.98.0-bookworm@sha256:82150a52ec202c1b14d7817e14516c392bb7f5cfebd88f1ed531cb37ebd39922
    depends_on: [rust]
    environment:
      TEST_DATABASE_URL: postgres://apex:apex@database:5432/apex_ci
      TEST_REDIS_URL: redis://redis:6379
    commands:
      - until bash -c 'echo > /dev/tcp/database/5432' 2>/dev/null; do sleep 1; done
      - bash scripts/ci/run_pg_integration_suites.sh

  # N3: the deleted parallel `crates/store/migrations/` lineage (versions
  # 066/067/095) must never appear in an applied environment. Runs against the
  # same apex_ci database the canonical `migrations` step just bootstrapped;
  # blocking (no `failure: ignore`).
  - name: legacy-migration-lineage
    image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
    depends_on: [migrations]
    environment:
      DATABASE_URL: postgres://apex:apex@database:5432/apex_ci
      TEST_DATABASE_URL: postgres://apex:apex@database:5432/apex_ci
    commands:
      - apk add --no-cache bash postgresql16-client
      - until pg_isready -h database -p 5432 -U apex >/dev/null 2>&1; do sleep 1; done
      - bash scripts/ci/check_legacy_migration_lineage.sh

  # SMOKE STAGE — server-rendered UI route sweep only. Builds the API (rust
  # image also has Node), starts it against the database service, and drives a
  # real browser across every navigation route at mobile + desktop.
  - name: e2e-server-ui-smoke
    image: rust:1.98.0-bookworm@sha256:82150a52ec202c1b14d7817e14516c392bb7f5cfebd88f1ed531cb37ebd39922
    depends_on: [rust, migrations]
    environment:
      DATABASE_URL: postgres://apex:apex@database:5432/apex_ci
      APEX_ADMIN_USERNAME: admin
      # Argon2id PHC hash of the e2e password; the legacy SHA-256 hash is
      # rejected by default (ALLOW_LEGACY_PASSWORD_HASHES unset).
      APEX_ADMIN_PASSWORD_HASH: '$argon2id$v=19$m=19456,t=2,p=1$Qe/tm9Em6f7USVaFRR+YXg$TxfPRKI0V+m+Dx/BcP5Ybv2d8hbiQoI8oxMENcztwL4'
      SESSION_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      # CI only: allow a documented non-secret so startup validation passes.
      APEX_ALLOW_TEST_SESSION_SECRET: "1"
      # Service key for authenticated metadata checks (>= 32 chars).
      API_KEY_1: ci-features-check-key-0123456789abcdef,ci-check,service,ci-service
      # Admin key for the full GET-route sweep (admin-only /api routes).
      API_KEY_2: ci-sweep-admin-key-0123456789abcdef0123,ci-sweep,admin,admin
      SEARCH_INDEX_PATH: /tmp/apex-index
      # Test-only: the server refuses to start with rate limiting disabled
      # unless this explicit override is also present (same pattern as
      # APEX_ALLOW_TEST_SESSION_SECRET).
      RATE_LIMIT_DISABLED: "true"
      APEX_ALLOW_TEST_RATE_LIMIT_DISABLED: "1"
      HOST: 127.0.0.1
      PORT: "9095"
      NO_COLOR: "1"
    commands:
      # Container networks can be flaky; retry the package fetch and use
      # apt's own retry support before giving up.
      - >-
        for i in 1 2 3 4 5; do
        apt-get -o Acquire::Retries=5 update &&
        apt-get -o Acquire::Retries=5 install -y --no-install-recommends nodejs npm cmake clang && break;
        echo "apt attempt $i failed; retrying"; sleep 10; done
      - node --version && npm --version
      - npm ci
      - npx playwright install --with-deps chromium
      - until bash -c 'echo > /dev/tcp/database/5432' 2>/dev/null; do sleep 1; done
      - cargo build --release --bin apex-api --features llm --locked
      # Server output is kept in the CI log and in a file the route sweep
      # scans for ERROR lines emitted while it runs.
      - (./target/release/apex-api 2>&1 | tee /tmp/apex-api.log) & sleep 6
      - curl -sf http://127.0.0.1:9095/api/health
      # Production artifact must advertise the LLM capability. `/api/features`
      # is authenticated (audit P0-8), so the service key is presented. The API
      # only accepts `Authorization: Bearer` (no X-API-Key header).
      - 'curl -sf -H "Authorization: Bearer ci-features-check-key-0123456789abcdef" http://127.0.0.1:9095/api/features | grep -q "\"llm_enabled\":true"'
      # Deployment provenance route must answer with the running service identity.
      - curl -sf http://127.0.0.1:9095/api/version | grep -q '"service":"apex-api"'
      - BASE_URL=http://127.0.0.1:9095 ADMIN_USER=admin ADMIN_PASS=adminpassword node scripts/ci/e2e_server_ui.mjs
      # Every registered GET route (web + API) with seeded ids: no 5xx, no
      # 404 for a seeded detail page, no server-side ERROR log lines.
      - BASE_URL=http://127.0.0.1:9095 ADMIN_USER=admin ADMIN_PASS=adminpassword SWEEP_ADMIN_KEY=ci-sweep-admin-key-0123456789abcdef0123 SERVER_LOG=/tmp/apex-api.log node scripts/ci/e2e_route_sweep.mjs

  # JOURNEY CONTRACTS — Playwright specs that drive the real UI and then assert
  # the PostgreSQL rows the actions must have produced (not just rendered
  # success). Separate stage from the route sweep on purpose.
  - name: e2e-server-ui-journeys
    image: rust:1.98.0-bookworm@sha256:82150a52ec202c1b14d7817e14516c392bb7f5cfebd88f1ed531cb37ebd39922
    depends_on: [rust, migrations, e2e-server-ui-smoke]
    environment:
      BASE_URL: http://127.0.0.1:9095
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:9095
      DATABASE_URL: postgres://apex:apex@database:5432/apex_ci
      ADMIN_USER: admin
      ADMIN_PASS: adminpassword
      APEX_ADMIN_USERNAME: admin
      # Argon2id PHC hash of the e2e password; the legacy SHA-256 hash is
      # rejected by default (ALLOW_LEGACY_PASSWORD_HASHES unset).
      APEX_ADMIN_PASSWORD_HASH: '$argon2id$v=19$m=19456,t=2,p=1$Qe/tm9Em6f7USVaFRR+YXg$TxfPRKI0V+m+Dx/BcP5Ybv2d8hbiQoI8oxMENcztwL4'
      SESSION_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      # CI only: allow a documented non-secret so startup validation passes.
      APEX_ALLOW_TEST_SESSION_SECRET: "1"
      # Service key for authenticated metadata checks (>= 32 chars).
      API_KEY_1: ci-features-check-key-0123456789abcdef,ci-check,service,ci-service
      SEARCH_INDEX_PATH: /tmp/apex-index-journeys
      # Test-only: the server refuses to start with rate limiting disabled
      # unless this explicit override is also present (same pattern as
      # APEX_ALLOW_TEST_SESSION_SECRET).
      RATE_LIMIT_DISABLED: "true"
      APEX_ALLOW_TEST_RATE_LIMIT_DISABLED: "1"
      HOST: 127.0.0.1
      PORT: "9095"
    commands:
      - >-
        for i in 1 2 3 4 5; do
        apt-get -o Acquire::Retries=5 update &&
        apt-get -o Acquire::Retries=5 install -y --no-install-recommends nodejs npm cmake clang && break;
        echo "apt attempt $i failed; retrying"; sleep 10; done
      - npm ci
      - npx playwright install --with-deps chromium
      - until bash -c 'echo > /dev/tcp/database/5432' 2>/dev/null; do sleep 1; done
      - cargo build --release --bin apex-api --features llm --locked
      - ./target/release/apex-api & sleep 6
      - curl -sf http://127.0.0.1:9095/api/health
      # Single definition of the journey spec list lives in package.json.
      - npm run test:server-ui:journeys

  # Container-level browser integration. Builds the worker image's
  # browser-check stage (real runtime image + Chromium) and renders a JS-only
  # fixture (late network + lazy-loaded DOM) through the shipped worker image,
  # proving Browser-strategy sources are renderable in the container.
  # Requires a Docker daemon on the runner: the host socket is mounted below.
  # The step executes repository code with that socket plus SYS_ADMIN, so it
  # is restricted to trusted events and never runs on pull requests. SYS_ADMIN
  # + seccomp=unconfined are test-only (see browser_container_check.sh); the
  # deployed worker uses Chromium's seccomp profile instead (Dockerfile.worker).
  - name: browser-container
    image: docker:27-cli@sha256:851f91d241214e7c6db86513b270d58776379aacc5eb9c4a87e5b47115e3065c
    depends_on: [rust]
    when:
      - event: [push, tag, manual]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - apk add --no-cache bash
      - bash scripts/ci/browser_container_check.sh

  # RELEASE EVIDENCE (P1-8) — binds this pipeline's gates to the exact commit
  # SHA and writes release-evidence/<sha>/release-evidence.{json,txt} plus a
  # .sha256 sidecar. The step re-runs the cheap self-contained gates
  # (exact-sha, rustfmt) and records the gates owned by the steps above as
  # `pipeline-step` results; depends_on guarantees those steps passed first,
  # and anything not run is published as `not_run` (complete=false), never
  # claimed. CI_COMMIT_SHA / CI_PIPELINE_NUMBER / CI_PIPELINE_CREATED are
  # injected by Woodpecker and feed /api/version via the printed exports.
  - name: release-evidence
    image: rust:1.98.0-bookworm@sha256:82150a52ec202c1b14d7817e14516c392bb7f5cfebd88f1ed531cb37ebd39922
    depends_on: [rust, migrations, e2e-server-ui-smoke, e2e-server-ui-journeys, ui-assets, wasm-shared]
    when:
      - event: [pull_request]
    commands:
      - rustup component add rustfmt
      - >-
        bash scripts/ci/release_evidence.sh
        --sha "${CI_COMMIT_SHA}"
        --gate exact-sha
        --gate rustfmt
        --record clippy-default=passed
        --record clippy-all-features=passed
        --record unit-tests=passed
        --record all-features-tests=passed
        --record pg-canonical=passed
        --record migration-bootstrap=passed
        --record browser-integration=passed
        --record ui-journey=passed
        --record tailwind-assets=passed
        --record wasm-shared=passed

  # Release-event evidence additionally records the container browser gate,
  # which only runs on trusted events (push/tag/manual).
  - name: release-evidence-release
    image: rust:1.98.0-bookworm@sha256:82150a52ec202c1b14d7817e14516c392bb7f5cfebd88f1ed531cb37ebd39922
    depends_on: [rust, migrations, e2e-server-ui-smoke, e2e-server-ui-journeys, ui-assets, wasm-shared, browser-container]
    when:
      - event: [push, tag, manual]
    commands:
      - rustup component add rustfmt
      - >-
        bash scripts/ci/release_evidence.sh
        --sha "${CI_COMMIT_SHA}"
        --gate exact-sha
        --gate rustfmt
        --record clippy-default=passed
        --record clippy-all-features=passed
        --record unit-tests=passed
        --record all-features-tests=passed
        --record pg-canonical=passed
        --record migration-bootstrap=passed
        --record browser-integration=passed
        --record ui-journey=passed
        --record tailwind-assets=passed
        --record wasm-shared=passed
        --record container-browser=passed
